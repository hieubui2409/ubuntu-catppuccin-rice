# dconf-rice.ini — Catppuccin Mocha Mauve cho GNOME 46
# Áp dụng:  dconf load / < gnome/dconf-rice.ini   (đã được apply-gnome-settings.sh gọi)
# Palette: base #1e1e2e · surface0 #313244 · text #cdd6f4 · mauve #cba6f7

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='catppuccin-mocha-mauve-standard+default'
icon-theme='Tela-circle-purple-dark'
cursor-theme='catppuccin-mocha-mauve-cursors'
cursor-size=24
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='CaskaydiaCove Nerd Font Mono 12'
font-antialiasing='rgba'
font-hinting='slight'
clock-show-weekday=false
clock-show-date=true
clock-show-seconds=true
enable-hot-corners=true

[org/gnome/desktop/wm/preferences]
titlebar-font='Inter Semi-Bold 11'
button-layout='appmenu:minimize,maximize,close'
num-workspaces=4

[org/gnome/desktop/background]
picture-options='zoom'
primary-color='#1e1e2e'
secondary-color='#1e1e2e'

[org/gnome/desktop/screensaver]
picture-options='zoom'
primary-color='#1e1e2e'

[org/gnome/shell/extensions/user-theme]
name='catppuccin-mocha-mauve-standard+default'

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
extend-height=false
dock-fixed=false
autohide=true
intellihide=true
intellihide-mode='FOCUS_APPLICATION_WINDOWS'
transparency-mode='FIXED'
background-opacity=0.65
custom-background-color=true
background-color='#1e1e2e'
custom-theme-shrink=true
dash-max-icon-size=44
icon-size-fixed=false
multi-monitor=true
show-trash=false
show-mounts=false
click-action='minimize-or-previews'
scroll-action='cycle-windows'
running-indicator-style='DOTS'
custom-theme-customize-running-dots=true
custom-theme-running-dots-color='#cba6f7'
custom-theme-running-dots-border-color='#cba6f7'
apply-custom-theme=false
disable-overview-on-startup=true

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=false

[org/gnome/shell/extensions/blur-my-shell/overview]
blur=true
pipeline='pipeline_default'

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
brightness=0.7
sigma=25
static-blur=true
style-dash-to-dock=0

[org/gnome/shell/extensions/blur-my-shell/applications]
blur=false

[org/gnome/shell/extensions/openbar]
bartype='Floating'
position='Top'
height=34.0
margin=5.0
vpad=4.0
hpad=6.0
bradius=24.0
bwidth=0.0
neon=false
shadow=true
gradient=false
set-overview=true
set-notifications=true
fgcolor=['0.804','0.839','0.957']
dark-fgcolor=['0.804','0.839','0.957']
fgalpha=1.0
bgcolor=['0.118','0.118','0.180']
dark-bgcolor=['0.118','0.118','0.180']
bgalpha=0.82
iscolor=['0.118','0.118','0.180']
dark-iscolor=['0.118','0.118','0.180']
isalpha=0.85
hcolor=['0.796','0.651','0.969']
dark-hcolor=['0.796','0.651','0.969']
halpha=0.5
bcolor=['0.796','0.651','0.969']
dark-bcolor=['0.796','0.651','0.969']
balpha=0.6
shcolor=['0.067','0.067','0.106']
dark-shcolor=['0.067','0.067','0.106']
shalpha=0.16
mfgcolor=['0.804','0.839','0.957']
dark-mfgcolor=['0.804','0.839','0.957']
mfgalpha=1.0
mbgcolor=['0.094','0.094','0.145']
dark-mbgcolor=['0.094','0.094','0.145']
mbgalpha=0.95
smbgoverride=true
smbgcolor=['0.192','0.196','0.267']
dark-smbgcolor=['0.192','0.196','0.267']
mbcolor=['0.796','0.651','0.969']
dark-mbcolor=['0.796','0.651','0.969']
mbalpha=0.3
mhcolor=['0.796','0.651','0.969']
dark-mhcolor=['0.796','0.651','0.969']
mhalpha=0.4
mscolor=['0.796','0.651','0.969']
dark-mscolor=['0.796','0.651','0.969']
msalpha=0.85

# active-profile cần đường dẫn tuyệt đối (BMW v48) — apply-gnome-settings.sh tự ghi
# theo $HOME của máy đang cài, nên không đặt cứng ở đây.

[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true

[org/gnome/mutter]
dynamic-workspaces=false

[org/gnome/shell/extensions/vitals]
# Bỏ network khỏi Vitals — đã có com.hieubt.netspeed lo phần đó bên trái
hot-sensors=['_processor_usage_', '_memory_usage_']
position-in-panel=2
menu-centered=false
use-higher-precision=false

[org/gnome/shell/extensions/hieubt-netspeed]
font-size=10
label-width=58
download-color='#fab387'
upload-color='#94e2d5'

[org/gnome/shell/extensions/just-perfection]
panel-button-padding-size=4
panel-indicator-padding-size=2
panel-icon-size=16

[com/github/amezin/ddterm]
use-theme-colors=false
theme-variant='dark'
background-color='#1e1e2e'
foreground-color='#cdd6f4'
transparent-background=true
background-opacity=0.88
palette=['#45475a', '#f38ba8', '#a6e3a1', '#f9e2af', '#89b4fa', '#f5c2e7', '#94e2d5', '#bac2de', '#585b70', '#f38ba8', '#a6e3a1', '#f9e2af', '#89b4fa', '#f5c2e7', '#94e2d5', '#a6adc8']
custom-font='CaskaydiaCove Nerd Font Mono 12'
use-system-font=false

[org/gnome/shell/extensions/custom-hot-corners-extended/monitor-0-bottom-right-0]
action='show-desktop'

[org/gnome/shell/extensions/hidetopbar]
enable-active-window=true
enable-intellihide=true
show-in-overview=true
hot-corner=true
mouse-sensitive=true
mouse-sensitive-fullscreen-window=true
animation-time-autohide=0.2
pressure-threshold=100
