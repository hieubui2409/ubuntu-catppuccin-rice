# tmux.conf — Catppuccin Mocha, tối giản không cần plugin manager
# Cài: copy về ~/.config/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# --- Catppuccin Mocha status bar ---
# base #1e1e2e · surface0 #313244 · text #cdd6f4 · mauve #cba6f7 · green #a6e3a1
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S #[bg=#1e1e2e,fg=#cba6f7]"
set -g status-left-length 30
set -g status-right "#[fg=#a6e3a1]#h #[fg=#6c7086]· #[fg=#b4befe]%H:%M "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g clock-mode-colour "#cba6f7"
